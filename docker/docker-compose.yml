version: "3.9"

services:
  # ── Qdrant vector database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnidoc_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OmniDoc API ─────────────────────────────────────────────────────────────
  omnidoc_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omnidoc_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      OMNIDOC_QDRANT_HOST: qdrant
    volumes:
      - ../data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  qdrant_storage:
